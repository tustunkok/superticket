[project]
name = "superticket"
version = "0.1.0-beta.2"
description = "High-Velocity Ticketing & Hybrid AI Triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "bcrypt>=4.0,<5",
    "email-validator",
    "fastapi",
    "itsdangerous",
    "jinja2",
    "openai",
    "pydantic-settings",
    "python-jose[cryptography]",
    "python-multipart",
    "sqlalchemy",
    "starlette",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.setuptools]
packages = ["superticket"]
