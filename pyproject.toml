[project]
name = "superticket"
version = "0.1.0-alpha.1"
description = "High-Velocity Ticketing & Hybrid AI Triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
