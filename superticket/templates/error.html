{% extends "base.html" %}

{% block title %}{{ title }} - SuperTicket{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <h1 class="display-4 mb-3">{{ status_code }}</h1>
        <hr class="w-25 mx-auto mb-3">
        <h3>{{ title }}</h3>
        <p class="text-muted">{{ message }}</p>
        {% if code %}
        <code class="text-danger">{{ code }}</code>
        {% endif %}
        <div class="mt-4">
            <a href="/" class="btn btn-outline-primary"><i class="bi bi-house-door me-1"></i>Go to Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary ms-2"><i class="bi bi-arrow-left me-1"></i>Go Back</a>
        </div>
    </div>
</div>
{% endblock %}
