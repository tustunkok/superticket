<div class="table-responsive">
    <table class="table table-hover table-sm align-middle">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Category</th>
                <th>Item</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody>
            {% for ticket in tickets %}
            <tr>
                <td><a href="{{ ticket_url_prefix }}/{{ ticket.id }}" class="fw-semibold">{{ ticket.id }}</a></td>
                <td><span class="badge badge-{{ ticket.state }}">{{ ticket.state }}</span></td>
                <td><span class="badge badge-{{ ticket.priority | lower }}">{{ ticket.priority }}</span></td>
                <td>{{ ticket.category }} / {{ ticket.sub_category }}</td>
                <td>{{ ticket.item }}</td>
                <td class="text-muted small">{{ ticket.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6" class="text-center text-muted py-4">
                    <i class="bi bi-inbox display-6 d-block mb-2"></i>
                    No tickets found.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
