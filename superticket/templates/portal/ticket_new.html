<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Submit New Ticket</h2>
    <a href="/portal/" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>

<div class="card st-card">
    <div class="card-body">
        <form method="POST" action="/portal/tickets">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="category" class="form-label">Category</label>
                    <input type="text" class="form-control" id="category" name="category" placeholder="e.g. Hardware" required>
                </div>
                <div class="col-md-4">
                    <label for="sub_category" class="form-label">Sub-Category</label>
                    <input type="text" class="form-control" id="sub_category" name="sub_category" placeholder="e.g. Laptop" required>
                </div>
                <div class="col-md-4">
                    <label for="item" class="form-label">Item</label>
                    <input type="text" class="form-control" id="item" name="item" placeholder="e.g. Screen" required>
                </div>
                <div class="col-md-4">
                    <label for="urgency" class="form-label">Urgency</label>
                    <select class="form-select" id="urgency" name="urgency" required>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="impact" class="form-label">Impact</label>
                    <select class="form-select" id="impact" name="impact">
                        <option value="individual" selected>Individual</option>
                        <option value="dept">Department</option>
                        <option value="org">Organization</option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe your issue..."></textarea>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Submit Ticket</button>
                <a href="/portal/" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
